<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMG | Smart Medical Group</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- خط Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- ملف التنسيقات الخارجي -->
  <link rel="stylesheet" href="style.css?v=2.0">
</head>

<body>

  <!-- الهيدر العلوي -->
  <header class="site-header">
    <div class="site-container header-inner">
      
      <!-- شعار الموقع والهوية SMG -->
      <div class="brand-identity" id="brandLogo">
        <div class="brand-logo-icon">
          <i class="fa-solid fa-staff-snake"></i>
        </div>
        <div class="brand-meta">
          <span class="brand-name">SMG</span>
          <span class="brand-tagline" data-i18n="tagline">Smart Medical Group</span>
        </div>
      </div>

      <!-- أزرار التنقل الرئيسية العلوية -->
      <nav class="main-navigation">
        <button type="button" class="nav-tab-btn active" id="navHomeBtn">
          <i class="fa-solid fa-house"></i>
          <span data-i18n="navHome">الرئيسية</span>
        </button>

        <button type="button" class="nav-tab-btn" id="navOffersBtn">
          <i class="fa-solid fa-tags"></i>
          <span data-i18n="navOffers">العروض</span>
        </button>

        <button type="button" class="nav-tab-btn" id="navNewBtn">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span data-i18n="navNewArrivals">وصل حديثاً</span>
        </button>

        <button type="button" class="nav-tab-btn cart-btn-wrap" id="navCartBtn">
          <i class="fa-solid fa-cart-shopping"></i>
          <span data-i18n="navCart">السلة</span>
          <span class="cart-badge" id="cartCountBadge">0</span>
        </button>
      </nav>

      <!-- أدوات التحكم والوضع الليلي واللغة -->
      <div class="control-actions">
        <button type="button" class="btn-action whatsapp" id="whatsappDirectBtn" title="تواصل عبر واتساب">
          <i class="fa-brands fa-whatsapp"></i>
        </button>
        <button type="button" class="btn-action lang-switch" id="langBtn" title="تغيير اللغة">EN</button>
        <button type="button" class="btn-action theme-toggle" id="themeBtn" title="الوضع الليلي">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="site-container main-wrapper">
    
    <!-- شريط البحث الفوري -->
    <section class="search-hero-bar" id="searchBarSection">
      <div class="search-field">
        <input type="text" id="searchInput" placeholder="ابحث باسم المنتج، الكود، أو الشركة..." data-i18n-ph="searchPlaceholder" />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </section>

    <!-- الأقسام التابعة للرئيسية فقط (السلايدرات) -->
    <div id="homeExtraSections">
      
      <!-- 1. Slider بانر العروض الكبير (مولد ديناميكياً) -->
      <section class="hero-slider-section" id="offersSection">
        <div class="swiper swiper-hero">
          <div class="swiper-wrapper" id="heroBannersWrapper">
            <!-- سيتم حقن أي عدد من الإعلانات هنا عبر الجافاسكربت -->
          </div>
        </div>
        <div class="hero-pagination"></div>
      </section>

      <!-- 2. Slider قسم الشركات -->
      <section class="catalog-block" id="brandsSection">
        <div class="block-header">
          <div class="block-title">
            <span class="title-accent-bar"></span>
            <h3 data-i18n="browseCompanies">أبرز الشركات والماركات</h3>
          </div>
          <button class="link-view-all" onclick="switchView('all-companies')">
            <span data-i18n="viewAll">عرض الكل</span>
            <i class="fa-solid fa-chevron-left arrow-icon"></i>
          </button>
        </div>
        
        <div class="swiper swiper-companies">
          <div class="swiper-wrapper" id="companiesContainer"></div>
        </div>
      </section>

      <!-- 3. Slider قسم التصنيفات -->
      <section class="catalog-block" id="categoriesSection">
        <div class="block-header">
          <div class="block-title">
            <span class="title-accent-bar"></span>
            <h3 data-i18n="categoriesTitle">التصنيفات الرئيسية</h3>
          </div>
          <button class="link-view-all" onclick="switchView('all-categories')">
            <span data-i18n="viewAll">عرض الكل</span>
            <i class="fa-solid fa-chevron-left arrow-icon"></i>
          </button>
        </div>
        
        <div class="swiper swiper-categories">
          <div class="swiper-wrapper" id="categoriesContainer"></div>
        </div>
      </section>
    </div>

    <!-- 4. قسم عرض جميع الشركات (Grid View) -->
    <section class="catalog-block" id="allCompaniesSection" style="display: none;">
      <div class="cart-page-header">
        <div class="cart-page-title">
          <i class="fa-solid fa-briefcase-medical" style="color: var(--primary);"></i>
          <h2 data-i18n="allCompaniesTitle">جميع الشركات والماركات</h2>
        </div>
        <button type="button" class="btn-continue-shopping" onclick="switchView('home')">
          <i class="fa-solid fa-arrow-right arrow-icon"></i>
          <span data-i18n="backToHome">العودة للرئيسية</span>
        </button>
      </div>
      <div class="entities-grid" id="allCompaniesGrid"></div>
    </section>

    <!-- 5. قسم عرض جميع التصنيفات (Grid View) -->
    <section class="catalog-block" id="allCategoriesSection" style="display: none;">
      <div class="cart-page-header">
        <div class="cart-page-title">
          <i class="fa-solid fa-layer-group" style="color: var(--primary);"></i>
          <h2 data-i18n="allCategoriesTitle">جميع التصنيفات الطبية</h2>
        </div>
        <button type="button" class="btn-continue-shopping" onclick="switchView('home')">
          <i class="fa-solid fa-arrow-right arrow-icon"></i>
          <span data-i18n="backToHome">العودة للرئيسية</span>
        </button>
      </div>
      <div class="entities-grid" id="allCategoriesGrid"></div>
    </section>

    <!-- 6. قسم كتالوج المنتجات المسترجعة -->
    <section class="catalog-block" id="productsCatalogSection" style="display: none;">
      <div class="block-header">
        <div class="block-title">
          <span class="title-accent-bar"></span>
          <h3 id="catalogMainTitle" data-i18n="productsCatalogTitle">قائمة المواد والتجهيزات المتاحة</h3>
        </div>
      </div>

      <!-- شريط الفلاتر النشطة -->
      <div class="filter-status-bar" id="filterStatusBar" style="display: none;">
        <div class="active-chips" id="activeChipsContainer"></div>
        <button type="button" class="reset-filters-btn" id="resetFiltersBtn" data-i18n="resetFilters">
          مسح التصفية <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- شبكة المنتجات -->
      <div class="products-grid" id="productsGridContainer"></div>
    </section>

    <!-- 7. صفحة السلة المخصصة والمستقلة -->
    <section class="cart-page-section" id="cartPageSection" style="display: none;">
      <div class="cart-page-header">
        <div class="cart-page-title">
          <i class="fa-solid fa-cart-shopping" style="color: var(--primary);"></i>
          <h2 data-i18n="cartTitle">قائمة الطلب الحالية</h2>
        </div>
        <button type="button" class="btn-continue-shopping" onclick="switchView('home')">
          <i class="fa-solid fa-arrow-right arrow-icon"></i>
          <span data-i18n="continueShopping">متابعة التسوق</span>
        </button>
      </div>

      <div id="cartPageContent"></div>
    </section>

  </main>

  <!-- إشعار Toast عند الإضافة -->
  <div class="toast-notice" id="toastNotice"></div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- ملف code.js -->
  <script src="code.js?v=2.0"></script>
  <!-- الفوتر الغامق -->
  <footer class="site-footer">
    <div class="site-container footer-inner">
      <div class="footer-brand-side">
        <div class="footer-logo">
          <i class="fa-solid fa-staff-snake"></i>
          <span>SMG</span>
          <span class="footer-trade-mark">® Trademark</span>
        </div>
        <p class="footer-copyright" data-i18n="footerRights">
          جميع الحقوق محفوظة © 2026 Smart Medical Group.
        </p>
      </div>

      <!-- رابط حساب shortcut على إنستغرام -->
      <div class="footer-shortcut-side">
        <i class="fa-solid fa-bolt"></i>
        <span>Made by <a href="https://www.instagram.com/shortcut_the_official?igsh=MXRhNWV3aGJ1cGl6eA==" target="_blank" rel="noopener noreferrer" class="brand-creator-link">shortcut</a></span>
      </div>
    </div>
  </footer>

   
</body>
</html>
